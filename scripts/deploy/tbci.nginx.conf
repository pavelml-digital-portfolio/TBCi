# Site-specific HTTP virtual host. Add trusted HTTPS using the VPS's certificate
# management process before publishing; the workflow requires valid HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tbci.pavelml.ru;
    root /var/www/tbci.pavelml.ru/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /deployment.json {
        add_header Cache-Control "no-store";
    }
    location ~ /\. {
        deny all;
    }
}
