components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Amount:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      description: Десятичная денежная строка; точность определяется активом.
    PositiveAmount:
      type: string
      pattern: ^(?=.*[1-9])(0|[1-9][0-9]*)(\.[0-9]+)?$
      description: Десятичная денежная строка; точность определяется активом.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
    Page:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type:
          - string
          - 'null'
    Index:
      type: object
      required:
      - id
      - name
      - points
      - tokenPrice
      properties:
        id:
          type: string
        name:
          type: string
        points:
          $ref: '#/components/schemas/Amount'
        tokenPrice:
          $ref: '#/components/schemas/Amount'
        change24h:
          type: string
    Wallet:
      type: object
      required:
      - assetId
      - available
      - reserved
      properties:
        assetId:
          type: string
        available:
          $ref: '#/components/schemas/Amount'
        reserved:
          $ref: '#/components/schemas/Amount'
    QuoteRequest:
      type: object
      additionalProperties: false
      required:
      - indexId
      - kind
      - amount
      properties:
        indexId:
          type: string
        kind:
          enum:
          - buy
          - sell
          - compile
          - unmake
        amount:
          $ref: '#/components/schemas/PositiveAmount'
        paymentAssetId:
          type: string
    Quote:
      type: object
      required:
      - id
      - expiresAt
      - request
      - components
      - fee
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
        request:
          $ref: '#/components/schemas/QuoteRequest'
        basketSnapshotId:
          type: string
        components:
          type: array
          items:
            type: object
            required:
            - assetId
            - amount
            properties:
              assetId:
                type: string
              amount:
                $ref: '#/components/schemas/Amount'
        fee:
          $ref: '#/components/schemas/Amount'
        feeAssetId:
          type: string
    Execution:
      type: object
      additionalProperties: false
      required:
      - quoteId
      properties:
        quoteId:
          type: string
    Order:
      type: object
      required:
      - id
      - state
      properties:
        id:
          type: string
        state:
          enum:
          - pending
          - completed
          - failed
          - unknown
        claims:
          type: array
          items:
            type: object
            properties:
              assetId:
                type: string
              remaining:
                $ref: '#/components/schemas/Amount'
    ClaimRequest:
      type: object
      additionalProperties: false
      properties:
        assetId:
          type: string
          description: Один компонент; отсутствие означает все оставшиеся.
