  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Actor + route + key; повтор с другим payload — 409. Cache не отменяет постоянную дедупликацию
        quote/requestId.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Обязателен для изменяющего cookie-auth запроса; не требуется для подписанного partner/provider
        входа.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AsOf:
      name: as_of
      in: query
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: Структурированная ошибка; code и request_id обязательны.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tbci_session
      description: Web сессия Secure/HttpOnly; финансовые POST требуют CSRF при cookie-auth.
    partnerBearer:
      type: http
      scheme: bearer
      description: Непрозрачный scoped API credential, отзываемый и хранимый как hash; права проверяются сервером.
    providerSignature:
      type: apiKey
      in: header
      name: X-Event-Signature
      description: HMAC-SHA256(timestamp + dot + raw body), политика конкретного адаптера подтверждается отдельно.
