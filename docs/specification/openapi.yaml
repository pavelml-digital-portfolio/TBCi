          description: Архивные факты и отдельно помеченные демонстрационные поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
      parameters:
      - name: year
        in: query
        schema:
          type: integer
          enum:
          - 2018
          default: 2018
  /icos/{id}:
    get:
      operationId: icoArchiveDetail
      summary: Архивная запись ICO и происхождение данных
      security: []
      responses:
        '200':
          description: Архивные факты и отдельно помеченные демонстрационные поля
          content:
