info:
  title: TBCi core API — проект к ТЗ
  version: 1.0.0
  description: Проект контракта ядра. Денежные значения — строки. URL относительный, не действующий production endpoint.
    Реальные провайдеры и параметры требуют согласования D01–D18.
servers:
- url: /api/v1
x-contract-status: draft-defined-core
x-not-yet-detailed:
- Provider-specific custody/KYC wire callbacks and legal retention settings
- TradingView vendor adapter wire format
- Full operator search/policy-edit commands and provider-specific order/fee fields; bounded by technical specification
