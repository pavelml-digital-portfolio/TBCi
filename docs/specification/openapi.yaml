          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketDraftRequest'
  /backoffice/baskets/{id}/activate:
    post:
      operationId: basketActivate
      summary: Запустить контролируемый cutover
      tags:
      - backoffice
      x-contract-status: draft-defined
      security:
      - sessionCookie: []
      responses:
        '202':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_id:
                  $ref: '#/components/schemas/Id'
                terms_hash:
                  type: string
              required:
              - approval_id
              - terms_hash
              additionalProperties: false
      description: Не активировать до покрытия backing, двух одобрений и обработки pending операций; команда создаёт
        операцию cutover.
components:
  schemas:
    Id:
      type: string
      format: uuid
    Decimal:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      description: Неотрицательный decimal без экспоненты и локальных разделителей. Никогда JSON number.
      examples:
      - '0'
      - '10000.00'
      - '0.833333333'
      maxLength: 120
    PositiveDecimal:
      type: string
      pattern: ^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$
      examples:
      - '1'
      - '0.8'
      maxLength: 120
    Units:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      examples:
      - '100000000'
      maxLength: 78
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        request_id:
          $ref: '#/components/schemas/Id'
        field_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      additionalProperties: false
    Amount:
      type: object
      properties:
        asset_id:
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/Decimal'
        amount_units:
          $ref: '#/components/schemas/Units'
      required:
      - asset_id
      - amount
      additionalProperties: false
      description: Если amount_units передано, оно соответствует amount и точности версии актива.
    Freshness:
      type: object
      properties:
        state:
          enum:
          - fresh
          - stale
          - unavailable
        observed_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        provider:
          type: string
        revision:
          type: integer
          minimum: 1
      required:
      - state
      - observed_at
      - received_at
      - provider
      - revision
      additionalProperties: false
    Asset:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        symbol:
          type: string
        name:
          type: string
        status:
          enum:
          - enabled
          - read_only
          - paused
          - disabled
        price_usd:
          $ref: '#/components/schemas/Decimal'
        market_cap_usd:
          $ref: '#/components/schemas/Decimal'
        freshness:
          $ref: '#/components/schemas/Freshness'
      required:
      - id
      - symbol
      - name
      - status
      additionalProperties: false
    Index:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        value:
          $ref: '#/components/schemas/Decimal'
        unit:
          const: points
        methodology_version_id:
          $ref: '#/components/schemas/Id'
        change_percent:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        freshness:
          $ref: '#/components/schemas/Freshness'
      required:
      - id
      - name
      - unit
      - methodology_version_id
      - freshness
      additionalProperties: false
    HistoryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          $ref: '#/components/schemas/Decimal'
        revision:
          type: integer
          minimum: 1
        quality:
          enum:
          - valid
          - corrected
          - unavailable
      required:
      - timestamp
      - revision
      - quality
      additionalProperties: false
    History:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        interval:
          type: string
        as_of:
          type: string
          format: date-time
        next_cursor:
          type:
          - string
          - 'null'
        aggregation_method:
          type: string
      required:
      - items
      - interval
      - as_of
      - next_cursor
      - aggregation_method
      additionalProperties: false
    Composition:
      type: object
      properties:
        version_id:
          $ref: '#/components/schemas/Id'
        effective_at:
          type: string
          format: date-time
        components:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              asset_id:
                $ref: '#/components/schemas/Id'
              quantity_per_token:
                $ref: '#/components/schemas/Decimal'
              start_weight:
                $ref: '#/components/schemas/Decimal'
              current_weight:
                $ref: '#/components/schemas/Decimal'
            required:
            - asset_id
            - start_weight
            additionalProperties: false
        divisor:
          $ref: '#/components/schemas/Decimal'
        methodology_version_id:
          $ref: '#/components/schemas/Id'
      required:
      - version_id
      - effective_at
      - components
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        status:
          type: string
        locale:
          enum:
          - ru
          - en
        timezone:
          type: string
        kyc_state:
          enum:
          - not_started
          - pending
          - approved
          - rejected
          - expired
          - review_required
        allowed_actions:
          type: array
          items:
            type: string
      required:
      - id
      - email
      - email_verified
      - status
      - locale
      - timezone
      - kyc_state
      - allowed_actions
      additionalProperties: false
    Wallet:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        asset_id:
          $ref: '#/components/schemas/Id'
        available_units:
          $ref: '#/components/schemas/Units'
        reserved_units:
          $ref: '#/components/schemas/Units'
        pending_units:
          $ref: '#/components/schemas/Units'
        display_decimals:
          type: integer
          minimum: 0
          maximum: 36
        updated_at:
          type: string
          format: date-time
        asset_route_id:
          $ref: '#/components/schemas/Id'
      required:
      - id
      - asset_id
      - available_units
      - reserved_units
      - pending_units
      - display_decimals
      - updated_at
      - asset_route_id
      additionalProperties: false
    DepositAddress:
      type: object
      properties:
        asset_route_id:
          $ref: '#/components/schemas/Id'
        network_id:
          $ref: '#/components/schemas/Id'
        address:
          type: string
        memo:
          type:
          - string
          - 'null'
        min_deposit:
          $ref: '#/components/schemas/Amount'
        required_confirmations:
          type: integer
          minimum: 1
        status:
          type: string
      required:
      - asset_route_id
      - network_id
      - address
      - memo
      - status
      additionalProperties: false
    Token:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        symbol:
          type: string
        network_id:
          $ref: '#/components/schemas/Id'
        contract_address:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 36
        active_basket_version_id:
          $ref: '#/components/schemas/Id'
        nav:
          $ref: '#/components/schemas/Amount'
        total_supply_units:
          $ref: '#/components/schemas/Units'
        freshness:
          $ref: '#/components/schemas/Freshness'
      required:
      - id
      - name
      - symbol
      - network_id
      - decimals
      additionalProperties: false
    Destination:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 512
        memo:
          type:
          - string
          - 'null'
          maxLength: 256
      required:
      - address
      additionalProperties: false
    BuyQuoteRequest:
      type: object
      properties:
        operation_type:
          const: buy
        token_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/PositiveDecimal'
        pay_wallet_id:
          $ref: '#/components/schemas/Id'
      required:
      - operation_type
      - token_id
      - quantity
      - pay_wallet_id
      additionalProperties: false
    SellQuoteRequest:
      type: object
      properties:
        operation_type:
          const: sell
        token_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/PositiveDecimal'
        receive_wallet_id:
          $ref: '#/components/schemas/Id'
      required:
      - operation_type
      - token_id
      - quantity
      - receive_wallet_id
      additionalProperties: false
    CompileQuoteRequest:
      type: object
      properties:
        operation_type:
          const: compile
        token_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/PositiveDecimal'
      required:
      - operation_type
      - token_id
      - quantity
      additionalProperties: false
    UnmakeQuoteRequest:
      type: object
      properties:
        operation_type:
          const: unmake
        token_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/PositiveDecimal'
      required:
      - operation_type
      - token_id
      - quantity
      additionalProperties: false
    WithdrawalQuoteRequest:
      type: object
      properties:
        operation_type:
          const: withdraw
        wallet_id:
          $ref: '#/components/schemas/Id'
        asset_route_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/PositiveDecimal'
        destination:
          $ref: '#/components/schemas/Destination'
      required:
      - operation_type
      - wallet_id
      - asset_route_id
      - quantity
      - destination
      additionalProperties: false
    QuoteRequest:
      oneOf:
      - $ref: '#/components/schemas/BuyQuoteRequest'
      - $ref: '#/components/schemas/SellQuoteRequest'
      - $ref: '#/components/schemas/CompileQuoteRequest'
      - $ref: '#/components/schemas/UnmakeQuoteRequest'
      - $ref: '#/components/schemas/WithdrawalQuoteRequest'
      discriminator:
        propertyName: operation_type
        mapping:
          buy: '#/components/schemas/BuyQuoteRequest'
          sell: '#/components/schemas/SellQuoteRequest'
          compile: '#/components/schemas/CompileQuoteRequest'
          unmake: '#/components/schemas/UnmakeQuoteRequest'
          withdraw: '#/components/schemas/WithdrawalQuoteRequest'
    Fee:
      type: object
      properties:
        type:
          enum:
          - service
          - liquidity
          - network
          - rounding
        amount:
          $ref: '#/components/schemas/Amount'
        rate:
          $ref: '#/components/schemas/Decimal'
        basis:
          $ref: '#/components/schemas/Amount'
        payer:
          enum:
          - user
          - treasury
        included_in_total:
          type: boolean
      required:
      - type
      - amount
      - payer
      - included_in_total
      additionalProperties: false
    Movement:
      type: object
      properties:
        direction:
          enum:
          - debit
          - credit
        wallet_id:
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/Amount'
        shortfall:
          $ref: '#/components/schemas/Amount'
        max_network_fee:
          $ref: '#/components/schemas/Amount'
      required:
      - direction
      - amount
      additionalProperties: false
    Quote:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        operation_type:
          enum:
          - buy
          - sell
          - compile
          - unmake
          - withdraw
        actor_id:
          $ref: '#/components/schemas/Id'
        token_id:
          $ref: '#/components/schemas/Id'
        quantity:
          $ref: '#/components/schemas/PositiveDecimal'
        basket_version_id:
          $ref: '#/components/schemas/Id'
        state:
          enum:
          - active
          - awaiting_approval
          - accepted
          - expired
          - invalidated
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        prices_as_of:
          type: string
          format: date-time
        fee_policy_version:
          type: string
        terms_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        movements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Movement'
        fees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
        requires_confirmation:
          type: boolean
        warnings:
          type: array
          items:
            type: string
      required:
      - id
      - operation_type
      - actor_id
      - quantity
      - state
      - created_at
      - expires_at
      - fee_policy_version
      - terms_hash
      - movements
      - fees
      - requires_confirmation
      - warnings
      additionalProperties: false
    OperationStep:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
        state:
          type: string
        network_id:
          $ref: '#/components/schemas/Id'
        tx_hash:
          type: string
        confirmations:
          type: integer
          minimum: 0
        required_confirmations:
          type: integer
          minimum: 1
        error_code:
          type: string
      required:
      - id
      - kind
      - state
      additionalProperties: false
    Operation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          enum:
          - buy
          - sell
          - compile
          - unmake
          - withdraw
          - deposit
        quote_id:
          $ref: '#/components/schemas/Id'
        actor_id:
          $ref: '#/components/schemas/Id'
        state:
          enum:
          - created
          - awaiting_approval
          - reserved
          - executing
          - awaiting_network
          - partially_completed
          - compensating
          - manual_review
          - completed
          - failed
          - cancelled
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OperationStep'
        can_cancel:
          type: boolean
        error_code:
          type: string
        correlation_id:
          $ref: '#/components/schemas/Id'
      required:
      - id
      - type
      - actor_id
      - state
      - version
      - created_at
      - updated_at
      - movements
      - steps
      - can_cancel
      - correlation_id
      additionalProperties: false
    CreateOperationRequest:
      type: object
      properties:
        quote_id:
          $ref: '#/components/schemas/Id'
        terms_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        confirmation_token:
          type: string
          maxLength: 2048
      required:
      - quote_id
      - terms_hash
      additionalProperties: false
      description: Без обязательного MFA token создаётся awaiting_approval без списания/резерва. Для исполнения
        требуется confirm и повторная проверка quote TTL.
    ConfirmOperationRequest:
      type: object
      properties:
        confirmation_token:
          type: string
          minLength: 1
          maxLength: 2048
      required:
      - confirmation_token
      additionalProperties: false
    ConfirmationChallenge:
      type: object
      properties:
        challenge_id:
          $ref: '#/components/schemas/Id'
        operation_id:
          $ref: '#/components/schemas/Id'
        terms_hash:
          type: string
        expires_at:
          type: string
          format: date-time
        method:
          const: totp
      required:
      - challenge_id
      - operation_id
      - terms_hash
      - expires_at
      - method
      additionalProperties: false
    ConfirmationToken:
      type: object
      properties:
        confirmation_token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - confirmation_token
      - expires_at
      additionalProperties: false
    Event:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/Id'
        event_type:
          type: string
        schema_version:
          const: 1
        occurred_at:
          type: string
          format: date-time
        aggregate_id:
          $ref: '#/components/schemas/Id'
        aggregate_version:
          type: integer
          minimum: 1
        correlation_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: true
      required:
      - event_id
      - event_type
      - schema_version
      - occurred_at
      - aggregate_id
      - aggregate_version
      - correlation_id
      - data
      additionalProperties: false
      description: data валидируется отдельной схемой события. Подпись проверяется по raw body до обработки.
    Acknowledgement:
      type: object
      properties:
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/Id'
      required:
      - message
      - request_id
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        state:
          enum:
          - authenticated
          - mfa_required
        user:
          anyOf:
          - $ref: '#/components/schemas/User'
          - type: 'null'
        challenge_id:
          $ref: '#/components/schemas/Id'
      required:
      - state
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        device_label:
          type: string
        is_current:
          type: boolean
      required:
      - id
      - created_at
      - last_seen_at
      - is_current
      additionalProperties: false
    PolicyCommand:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
        scope:
          type: string
        enabled:
          type: boolean
        expected_version:
          type: integer
          minimum: 1
      required:
      - reason
      - scope
      - enabled
      additionalProperties: false
    ApprovalCommand:
      type: object
      properties:
        decision:
          enum:
          - approve
          - reject
        reason:
          type: string
          minLength: 5
        terms_hash:
          type: string
      required:
      - decision
      - reason
      - terms_hash
      additionalProperties: false
    Reconciliation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        scope:
          type: string
        cutoff_at:
          type: string
          format: date-time
        state:
          enum:
          - running
          - passed
          - discrepancy
          - source_unavailable
        discrepancies:
          type: array
          items:
            type: object
            properties:
              asset_id:
                $ref: '#/components/schemas/Id'
              expected:
                $ref: '#/components/schemas/Decimal'
              observed:
                $ref: '#/components/schemas/Decimal'
              code:
                type: string
            required:
            - asset_id
            - code
            additionalProperties: false
      required:
      - id
      - scope
      - cutoff_at
      - state
      additionalProperties: false
    Portfolio:
      type: object
      properties:
        valuation_currency:
          type: string
        as_of:
          type: string
          format: date-time
        total_estimated:
          $ref: '#/components/schemas/Decimal'
        stale_asset_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'
        pnl_available:
          type: boolean
      required:
      - valuation_currency
      - as_of
      - stale_asset_ids
      - wallets
      - pnl_available
      additionalProperties: false
    Content:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        locale:
          enum:
          - ru
          - en
        title:
          type: string
        body_html:
          type: string
        revision:
          type: integer
          minimum: 1
        published_at:
          type: string
          format: date-time
        source_url:
          type: string
          format: uri
      required:
      - id
      - slug
      - locale
      - title
      - revision
      - published_at
      additionalProperties: false
    Exchange:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        website:
          type: string
          format: uri
        volume_usd_24h:
          $ref: '#/components/schemas/Decimal'
        freshness:
          $ref: '#/components/schemas/Freshness'
      required:
      - id
      - name
      additionalProperties: false
    Market:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        exchange_id:
          $ref: '#/components/schemas/Id'
        base_asset_id:
          $ref: '#/components/schemas/Id'
        quote_asset_id:
          $ref: '#/components/schemas/Id'
        price:
          $ref: '#/components/schemas/Decimal'
        volume_24h:
          $ref: '#/components/schemas/Decimal'
        observed_at:
          type: string
          format: date-time
      required:
      - id
      - exchange_id
      - base_asset_id
      - quote_asset_id
      - observed_at
      additionalProperties: false
    Holder:
      type: object
      properties:
        address:
          type: string
        amount_units:
          $ref: '#/components/schemas/Units'
        share:
          $ref: '#/components/schemas/Decimal'
      required:
      - address
      - amount_units
      additionalProperties: false
    AssetPage:
      type: object
      properties:
