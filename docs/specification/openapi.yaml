openapi: 3.1.0
info:
  title: TBCi — проект API по макетам
  version: 2.1.0
  description: Не реализован в текущем статическом демо. Только контракт ядра экранов;
    Page содержит ещё не детализированные read-модели. Провайдерские callbacks, сессии,
    deposits/withdrawals и лицензии будут специфицированы после выбора интеграций.
    Не заявляет готовый production backend.
servers:
- url: /api/v1
  description: Проект относительного URL, не действующий endpoint
x-contract-status: draft-for-next-backend-stage
