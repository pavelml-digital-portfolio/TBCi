name: Publish TBCi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbci-production
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: tbci-static-site
          path: apps/web/dist
      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('apps/web/dist/deployment.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'release': os.environ['RELEASE_ID']
          }) + '\n')
          PY
      - name: Upload and switch release
        id: release
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_DEFER_PUBLIC_CHECK: '1'
        shell: bash
        run: bash deploy/vps-publish.sh publish tbci.pavelml.ru apps/web/dist static
  public:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Verify public HTTPS release
        id: health
        shell: bash
        run: python3 deploy/verify-public.py --commit "$GITHUB_SHA" --release "$RELEASE_ID"
      - name: Roll back if public checks fail
        if: failure() && needs.publish.result == 'success' && steps.health.outputs.rollback_required == 'true'
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        shell: bash
        run: bash deploy/vps-publish.sh rollback tbci.pavelml.ru
      - name: Save public verification result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: public-verification
          path: ${{ runner.temp }}/tbci-public-verification.json
          if-no-files-found: ignore
          retention-days: 14
