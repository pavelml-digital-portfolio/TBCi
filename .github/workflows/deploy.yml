name: Publish TBCi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbci-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: tbci-static-site
          path: apps/web/dist
      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('apps/web/dist/deployment.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'release': os.environ['RELEASE_ID']
          }) + '\n')
          PY
      - name: Upload and switch release
        id: release
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        shell: bash
        run: bash deploy/vps-publish.sh publish tbci.pavelml.ru apps/web/dist static
      - name: Verify public HTTPS release
        id: health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 25 \
            "https://tbci.pavelml.ru/deployment.json?release=$RELEASE_ID" > "$RUNNER_TEMP/tbci-deployed.json"
          jq --exit-status --arg release "$RELEASE_ID" '.release == $release' "$RUNNER_TEMP/tbci-deployed.json"
          curl --fail --silent --show-error --max-time 25 https://tbci.pavelml.ru/ > "$RUNNER_TEMP/tbci-public.html"
          grep -q 'Структура рынка.' "$RUNNER_TEMP/tbci-public.html"
          curl --fail --silent --show-error --max-time 25 https://tbci.pavelml.ru/app/ > "$RUNNER_TEMP/tbci-account.html"
          grep -q 'astro-island' "$RUNNER_TEMP/tbci-account.html"
          echo 'Verified landing, account shell and exact release over HTTPS.' >> "$GITHUB_STEP_SUMMARY"
      - name: Roll back if public checks fail
        if: failure() && steps.release.outcome == 'success' && steps.health.outcome == 'failure'
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        shell: bash
        run: bash deploy/vps-publish.sh rollback tbci.pavelml.ru
