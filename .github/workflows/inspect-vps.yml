name: Inspect VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vps.yml
      - scripts/deploy/inspect-vps.sh

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: 87.242.65.97
      SSH_PORT: '22'
      SSH_USER: vps-deploy
    steps:
      - uses: actions/checkout@v5
      - name: Connect and inspect deployment capabilities
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          PINNED_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'VPS_DEPLOY_SSH_KEY is missing'; exit 1; }
          key_file="$RUNNER_TEMP/tbci-deploy-key"
          hosts_file="$RUNNER_TEMP/tbci-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          if [ -n "$PINNED_HOSTS" ]; then
            printf '%s\n' "$PINNED_HOSTS" > "$hosts_file"
          else
            ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$hosts_file"
          fi
          echo 'SSH host public key (pin this for future releases):'
          cat "$hosts_file"
          ssh-keygen -lf "$hosts_file"
          ssh -i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/deploy/inspect-vps.sh
