name: Inspect VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vps.yml
      - scripts/deploy/inspect-vps.sh

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: 87.242.65.97
      SSH_PORT: '22'
      SSH_USER: vps-deploy
    steps:
      - uses: actions/checkout@v5
      - name: Connect and inspect deployment capabilities
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          PINNED_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'VPS_DEPLOY_SSH_KEY is missing'; exit 1; }
          python3 - <<'PY'
          import os, socket
          host, port = os.environ['SSH_HOST'], int(os.environ['SSH_PORT'])
          try:
              with socket.create_connection((host, port), timeout=15) as connection:
                  connection.settimeout(10)
                  banner = connection.recv(256).decode('ascii', errors='replace').strip()
                  print(f'::notice title=SSH TCP connectivity::Connected to {host}:{port}; banner {banner}')
          except OSError as error:
              print(f'::error title=SSH TCP connectivity failed::{host}:{port}: {error}')
              raise SystemExit(1)
          PY
          key_file="$RUNNER_TEMP/tbci-deploy-key"
          hosts_file="$RUNNER_TEMP/tbci-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh-keygen -y -P '' -f "$key_file" > /dev/null || {
            echo '::error::VPS_DEPLOY_SSH_KEY is not a readable unencrypted private key.'
            exit 1
          }
          if [ -n "$PINNED_HOSTS" ]; then
            printf '%s\n' "$PINNED_HOSTS" > "$hosts_file"
          else
            ssh-keyscan -v -T 20 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$hosts_file" 2> "$RUNNER_TEMP/tbci-keyscan-error" || {
              while IFS= read -r line; do
                line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}
                echo "::error title=SSH host-key exchange::$line"
              done < "$RUNNER_TEMP/tbci-keyscan-error"
              echo "::error::SSH host-key scan failed for $SSH_HOST port $SSH_PORT; no verified SSH connection was attempted."
              exit 1
            }
          fi
          echo 'SSH host public key (pin this for future releases):'
          cat "$hosts_file"
          ssh-keygen -lf "$hosts_file"
          ssh -i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/deploy/inspect-vps.sh > "$RUNNER_TEMP/tbci-inspect-output" 2> "$RUNNER_TEMP/tbci-ssh-error" || {
              while IFS= read -r line; do
                line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}
                echo "::error title=SSH inspection failed::$line"
              done < "$RUNNER_TEMP/tbci-ssh-error"
              echo '::error::SSH inspection failed; see the diagnostic output for the server restriction.'
              cat "$RUNNER_TEMP/tbci-inspect-output"
              exit 1
            }
          cat "$RUNNER_TEMP/tbci-inspect-output"
